# Verifies that a change still installs, typechecks, lints, and builds before it
# reaches main.
#
# This repo had branch protection but no status checks, so pull requests — the
# ten open Dependabot bumps included — could not be verified by anything except
# a human reading the diff. A dependency bump that breaks the Next.js build was
# indistinguishable from one that did not until it had already been merged and
# deploy.yml had shipped it to the live site.
#
# The steps deliberately mirror deploy.yml (Node 20, the same build), so a green
# run here means the deploy will build too. `npm ci` rather than `npm install`:
# it is reproducible and fails loudly if package.json and the lockfile disagree.

name: PR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # No `typecheck` script in package.json; next build does not fail on
        # type errors under every config, so check explicitly.
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        # The step that actually catches a breaking dependency bump.
        run: npm run build

      - name: Mobile layout (no page may be wider than the phone it is viewed on)
        # NEITHER lint NOR build can see layout, so a navbar that laid its links
        # out in one non-wrapping row shipped to production and made every page
        # unreadable on a phone: the body measured 907px on a 375px screen, and
        # because `overflow-x: hidden` CLIPS rather than scrolls, the only way to
        # read the site was to rotate the device. It took a user report to find.
        # This measures the built export at 320/375/414px and fails on overflow.
        run: |
          npx playwright install --with-deps chromium
          npx --yes serve out -l 3000 --no-clipboard > /dev/null 2>&1 &
          curl -s --retry 40 --retry-delay 1 --retry-connrefused -m 90 -o /dev/null http://localhost:3000/
          npm run mobile-check

      - name: Accessibility (WCAG 2.1 A/AA)
        # The claim flow's round <select> shipped with no accessible name — a
        # screen reader announced the site's primary control as "combo box".
        # Nothing here could catch that: lint and build do not read the a11y
        # tree. Reuses the server started above.
        run: npm run a11y-check
